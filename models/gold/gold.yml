version: 2

# Gold layer: star schema (star/) and datamart views (mart/).
# The SCD2 dimensions are joined with
#   fact.month_start >= dim.valid_from and fact.month_start < dim.valid_to
# The rules that make this join safe (exactly one version per fact row, no
# overlapping versions, no lost fact rows) are checked by the SQL tests in
# the tests/ folder.

models:
  - name: dim_host
    description: Host dimension, SCD2. One row per version of a host.
    columns:
      - name: host_version_id
        data_tests: [not_null, unique]
      - name: host_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_listing
    description: Listing dimension, SCD2. One row per version of a listing.
    columns:
      - name: listing_version_id
        data_tests: [not_null, unique]
      - name: listing_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: valid_to
        data_tests: [not_null]

  - name: dim_lga
    description: LGA dimension, SCD2, with an 'unknown' member.
    columns:
      - name: lga_version_id
        data_tests: [not_null, unique]
      - name: lga_code
        data_tests: [not_null]

  - name: dim_suburb
    description: Suburb dimension with the LGA of each suburb, SCD2, with an 'unknown' member.
    columns:
      - name: suburb_version_id
        data_tests: [not_null, unique]
      - name: suburb_id
        data_tests: [not_null]

  - name: fact_listing_monthly
    description: Fact table, one row per listing per month. IDs and measures only.
    columns:
      - name: listing_id
        data_tests: [not_null]
      - name: host_id
        data_tests: [not_null]
      - name: lga_code
        data_tests: [not_null]
      - name: host_suburb_id
        data_tests: [not_null]
      - name: month_start
        data_tests: [not_null]
      - name: price
        description: Nightly price of the listing in that month's file.
      - name: availability_30
        description: Nights available in the next 30 days. Number of stays = 30 - availability_30.

  - name: ref_census_g01
    description: Census 2016 G01 per LGA, reference data. Join on lga_code.
    columns:
      - name: lga_code
        data_tests: [not_null, unique]

  - name: ref_census_g02
    description: Census 2016 G02 per LGA, reference data. Join on lga_code.
    columns:
      - name: lga_code
        data_tests: [not_null, unique]

  - name: dm_listing_neighbourhood
    description: Listing metrics per listing_neighbourhood and month.
    columns:
      - name: listing_neighbourhood
        data_tests: [not_null]
      - name: month_year
        description: First day of the month.
        data_tests: [not_null]

  - name: dm_property_type
    description: Listing metrics per property_type, room_type, accommodates and month.
    columns:
      - name: property_type
        data_tests: [not_null]
      - name: month_year
        description: First day of the month.
        data_tests: [not_null]

  - name: dm_host_neighbourhood
    description: Host and revenue metrics per host_neighbourhood_lga and month.
    columns:
      - name: host_neighbourhood_lga
        data_tests: [not_null]
      - name: month_year
        description: First day of the month.
        data_tests: [not_null]
